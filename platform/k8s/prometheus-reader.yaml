# Compte de service en lecture seule pour la collecte Prometheus (T08.3) : métriques des nœuds, des services et des pods
# via le proxy de l'API Kubernetes. Aucun droit d'écriture.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: prometheus-b6g
  namespace: kube-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: prometheus-b6g
rules:
  - apiGroups: [""]
    resources: [nodes, nodes/proxy, nodes/metrics, services, services/proxy, endpoints, pods, pods/proxy]
    verbs: [get, list, watch]
  - nonResourceURLs: [/metrics, /metrics/cadvisor]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: prometheus-b6g
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: prometheus-b6g}
subjects:
  - {kind: ServiceAccount, name: prometheus-b6g, namespace: kube-system}
