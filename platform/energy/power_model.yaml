# Modèle de puissance de l'exporteur énergie (M09, T25.2). Puissance par composant : P = P_idle + (P_max - P_idle) × charge CPU.
# Valeurs indicatives (watts) choisies pour rendre les écarts mesurables ; justifiées dans ateliers/a25/README.md.
# Réalisme : SIMULÉ (aucune mesure électrique réelle). La correspondance composant -> classe se fait par préfixe de nom.
default: {p_idle_w: 2.0, p_max_w: 8.0}        # fonction réseau générique (AMF, AUSF, UDM, …)
classes:
  gnb:            {p_idle_w: 5.0,  p_max_w: 25.0}   # gNB : traitement radio simulé et GTP-U, poste le plus coûteux
  upf-:           {p_idle_w: 3.0,  p_max_w: 15.0}   # UPF : plan utilisateur (une par slice)
  smf-:           {p_idle_w: 2.0,  p_max_w: 6.0}
  mongo:          {p_idle_w: 2.0,  p_max_w: 5.0}
  k3d-b6g-agent-0: {p_idle_w: 10.0, p_max_w: 60.0}  # nœud Edge (capacité 2 cœurs, serveur compact)
  k3d-b6g-agent-1: {p_idle_w: 15.0, p_max_w: 90.0}  # nœud Fog
  k3d-b6g-agent-2: {p_idle_w: 25.0, p_max_w: 150.0} # nœud Cloud (serveur de centre de données)
