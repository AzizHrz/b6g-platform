# Collecte toutes les 5 s (contrat I-02). Les consommateurs n'utilisent que les noms b6g_* (rules/).
global:
  scrape_interval: 5s
  evaluation_interval: 5s
rule_files: [/etc/prometheus/rules/*.yml]
scrape_configs:
  # Cibles Open5GS générées depuis config/scenario.yaml par platform/core/render.py
  - job_name: open5gs
    file_sd_configs: [{files: [/etc/prometheus/targets/open5gs.json], refresh_interval: 30s}]
  - job_name: actuator
    static_configs: [{targets: ["host.docker.internal:8081"]}]
  - job_name: pushgateway
    honor_labels: true
    static_configs: [{targets: ["pushgateway:9091"]}]
  - job_name: cadvisor
    static_configs: [{targets: ["cadvisor:8080"]}]
    metric_relabel_configs:
      - source_labels: [__name__]
        regex: container_(cpu_usage_seconds_total|memory_working_set_bytes|spec_cpu_quota|last_seen)
        action: keep
  - job_name: prometheus
    static_configs: [{targets: ["localhost:9090"]}]
