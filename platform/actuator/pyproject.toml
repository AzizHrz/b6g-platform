[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "b6g-actuator"
version = "2.0.0"
description = "Actionneur B6G (M04, I-04) : seul point d'action sur la plateforme"
requires-python = ">=3.11"
dependencies = ["b6g-common", "fastapi>=0.110", "uvicorn>=0.29", "httpx>=0.27"]

[tool.setuptools.packages.find]
where = ["."]
include = ["b6g_actuator*"]
