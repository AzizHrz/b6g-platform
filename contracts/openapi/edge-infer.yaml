openapi: 3.1.0
info:
  title: B6G Inférence Edge (I-10)
  version: 1.0.0
  description: "Classification congestion / normal servie sur l'Edge."
servers:
  - url: http://b6g-plat:30092/v1
components:
  parameters:
    Caller:
      name: X-B6G-Caller
      in: header
      required: true
      schema: {type: string, pattern: "^[a-z0-9_-]+$"}
  responses:
    Problem:
      description: Erreur (RFC 9457)
      content:
        application/problem+json:
          schema: {$ref: "../common.schema.json#/$defs/problem"}
paths:
  /health:
    get:
      operationId: health
      responses: {"200": {description: OK, content: {application/json: {schema: {type: object, required: [status]}}}}}
  /infer:
    post:
      operationId: infer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [request_id, features]
              properties:
                request_id: {type: string}
                features:
                  type: object
                  required: [throughput_mbps, latency_ms_p95, loss_ratio, cpu_ratio]
                  properties:
                    throughput_mbps: {type: number}
                    latency_ms_p95: {type: number}
                    loss_ratio: {type: number}
                    cpu_ratio: {type: number}
      responses:
        "200":
          description: Prédiction
          content:
            application/json:
              schema:
                type: object
                required: [request_id, prediction, score, model_version, server_latency_ms]
                properties:
                  request_id: {type: string}
                  prediction: {enum: [congested, normal]}
                  score: {type: number, minimum: 0, maximum: 1}
                  model_version: {type: string}
                  server_latency_ms: {type: number, minimum: 0}
