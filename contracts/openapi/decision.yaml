openapi: 3.1.0
info:
  title: B6G Décision (I-05)
  version: 1.0.0
  description: "Politiques de décision. Une liste actions vide signifie aucune action."
servers:
  - url: http://b6g-intel:8090/v1
components:
  parameters:
    Caller:
      name: X-B6G-Caller
      in: header
      required: true
      schema: {type: string, pattern: "^[a-z0-9_-]+$"}
  responses:
    Problem:
      description: Erreur (RFC 9457)
      content:
        application/problem+json:
          schema: {$ref: "../common.schema.json#/$defs/problem"}
paths:
  /health:
    get:
      operationId: health
      responses: {"200": {description: OK, content: {application/json: {schema: {type: object, required: [status]}}}}}
  /policies:
    get:
      operationId: listPolicies
      parameters: [{$ref: "#/components/parameters/Caller"}]
      responses:
        "200":
          description: Politiques disponibles
          content: {application/json: {schema: {type: array, items: {type: object, required: [name, version, model_version, inputs]}}}}
  /decide:
    post:
      operationId: decide
      parameters: [{$ref: "#/components/parameters/Caller"}]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: "../decide-request.schema.json"}}}
      responses:
        "200":
          description: Decision
          content: {application/json: {schema: {$ref: "../decision.schema.json"}}}
        "400": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
