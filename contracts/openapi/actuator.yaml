openapi: 3.1.0
info:
  title: B6G Actionneur (I-04)
  version: 1.0.0
  description: "Seul point d'action sur la plateforme. dry_run=true valide et journalise sans rien appliquer."
servers:
  - url: http://b6g-plat:8081/v1
components:
  parameters:
    Caller:
      name: X-B6G-Caller
      in: header
      required: true
      schema: {type: string, pattern: "^[a-z0-9_-]+$"}
  responses:
    Problem:
      description: Erreur (RFC 9457)
      content:
        application/problem+json:
          schema: {$ref: "../common.schema.json#/$defs/problem"}
paths:
  /health:
    get:
      operationId: health
      responses:
        "200":
          description: OK
          content: {application/json: {schema: {type: object, required: [status, version], properties: {status: {const: ok}, version: {type: string}}}}}
  /state:
    get:
      operationId: getState
      parameters: [{$ref: "#/components/parameters/Caller"}]
      responses:
        "200":
          description: État courant (débit des slices, netem des liens, réplicas, UEs isolés)
          content: {application/json: {schema: {type: object, required: [slices, links, deployments, isolated_ues]}}}
  /actions:
    post:
      operationId: applyAction
      parameters:
        - {$ref: "#/components/parameters/Caller"}
        - {name: dry_run, in: query, schema: {type: boolean, default: false}}
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: "../action-request.schema.json"}}}
      responses:
        "200":
          description: ActionResult
          content: {application/json: {schema: {$ref: "../action-result.schema.json"}}}
        "400": {$ref: "#/components/responses/Problem"}
        "404": {$ref: "#/components/responses/Problem"}
        "409": {$ref: "#/components/responses/Problem"}
        "503": {$ref: "#/components/responses/Problem"}
  /actions/batch:
    post:
      operationId: applyBatch
      parameters:
        - {$ref: "#/components/parameters/Caller"}
        - {name: dry_run, in: query, schema: {type: boolean, default: false}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {type: object, required: [actions], properties: {actions: {type: array, maxItems: 10, items: {$ref: "../action-request.schema.json"}}}}
      responses:
        "200":
          description: Résultats dans l'ordre ; arrêt au premier échec
          content: {application/json: {schema: {type: object, required: [results], properties: {results: {type: array, items: {$ref: "../action-result.schema.json"}}}}}}
        "400": {$ref: "#/components/responses/Problem"}
