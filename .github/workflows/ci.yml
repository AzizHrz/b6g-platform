name: ci
on:
  push:
  pull_request:
jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Installer
        run: make setup
      - name: Lint
        run: make lint
      - name: Tests de contrat CT-01 à CT-08 (contre les mocks)
        run: make test-contracts
